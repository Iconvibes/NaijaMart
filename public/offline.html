<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e63946" />
  <title>NaijaMart — You're Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .card { text-align: center; max-width: 400px; width: 100%; }
    .icon { width: 80px; height: 80px; margin: 0 auto 1.5rem; background: #e6394620; border-radius: 1.5rem; display: flex; align-items: center; justify-content: center; }
    .icon span { font-size: 2.5rem; }
    h1 { font-size: 1.25rem; font-weight: 900; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #666; line-height: 1.5; margin-bottom: 1.5rem; }
    button { background: #e63946; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #d32f3e; }
    .brand { font-size: 0.75rem; color: #999; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><span>📡</span></div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <p class="brand">NaijaMart — Online Shopping in Nigeria</p>
  </div>
</body>
</html>
